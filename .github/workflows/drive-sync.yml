# Drive <-> GitHub senkronu (CYBORG_GITHUB_SYNC klasörü)
#   Drive _GELEN  -> repo (data/ veya DRIVE_GELEN/), sonra dosya _GELEN_ISLENDI'ye taşınır   [3 saatte bir + elle]
#   repo push     -> Drive REPO_AYNA (yalnız değişen dosyalar; silme yok)                    [her push'ta]
#   Elle "full_mirror" -> tüm repo REPO_AYNA'ya
# Tek gereken: repo secret GDRIVE_TOKEN (rclone authorize "drive" çıktısı).
name: drive-github-sync

on:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths-ignore: ['.github/**']
  workflow_dispatch:
    inputs:
      full_mirror:
        description: 'Tüm repoyu Drive REPO_AYNA klasörüne kopyala'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: drive-github-sync
  cancel-in-progress: false

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
  RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: 1qjkcklwTq7VZHp5PAsyqbHAjlKKQ3lr0

jobs:
  drive-to-github:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Token kontrolü
        id: tok
        run: |
          if [ -z "${RCLONE_CONFIG_GDRIVE_TOKEN}" ]; then echo "GDRIVE_TOKEN secret yok, atlanıyor."; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == '1'
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github
      - name: rclone kur
        if: steps.tok.outputs.ok == '1'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: _GELEN klasörünü indir ve repoya yerleştir
        if: steps.tok.outputs.ok == '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/in
          rclone copy gdrive:_GELEN /tmp/in --max-depth 1 --drive-skip-gdocs
          if [ -z "$(ls -A /tmp/in)" ]; then echo "_GELEN boş."; exit 0; fi
          python3 .github/scripts/drive_import.py /tmp/in "$PWD" /tmp/done.txt /tmp/made.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -d '\n' -a /tmp/made.txt git add --sparse --
          if git diff --cached --quiet; then echo "Değişiklik yok."; else
            git commit -m "Drive _GELEN içe aktarım: $(wc -l < /tmp/done.txt) dosya"
            git push origin HEAD:main
          fi
          rclone copy . gdrive:REPO_AYNA --files-from /tmp/made.txt
          while IFS= read -r f; do rclone moveto "gdrive:_GELEN/$f" "gdrive:_GELEN_ISLENDI/$f"; done < /tmp/done.txt

  github-to-drive:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_mirror)
    runs-on: ubuntu-latest
    steps:
      - name: Token kontrolü
        id: tok
        run: |
          if [ -z "${RCLONE_CONFIG_GDRIVE_TOKEN}" ]; then echo "GDRIVE_TOKEN secret yok, atlanıyor."; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == '1'
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - name: rclone kur
        if: steps.tok.outputs.ok == '1'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Değişen dosyaları REPO_AYNA'ya kopyala
        if: steps.tok.outputs.ok == '1'
        env:
          BEFORE: ${{ github.event.before }}
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "$FULL" = "true" ] || [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git ls-tree -r --name-only HEAD > /tmp/list.txt
          else
            git diff --name-only --diff-filter=AMR "$BEFORE" HEAD > /tmp/list.txt
          fi
          grep -v '^\.github/' /tmp/list.txt > /tmp/files.txt || true
          if [ ! -s /tmp/files.txt ]; then echo "Kopyalanacak dosya yok."; exit 0; fi
          mkdir -p /tmp/out
          while IFS= read -r f; do mkdir -p "/tmp/out/$(dirname "$f")"; git show "HEAD:$f" > "/tmp/out/$f"; done < /tmp/files.txt
          rclone copy /tmp/out gdrive:REPO_AYNA --transfers 4
          echo "$(wc -l < /tmp/files.txt) dosya Drive'a kopyalandı."
