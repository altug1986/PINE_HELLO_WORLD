name: rust-backtester
on:
  push:
    branches: [tw-rust-backtester-mvp]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-backtester
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test
      - name: Offline synthetic test
        run: cargo run --release -- --ohlc data/ohlc.csv --signals data/signals.csv --out results/demo --on-close
      - name: Strict Pine adapter demo
        run: |
          python3 tools/pine_bridge_ema.py --pine data/ema_example.pine --ohlc data/ohlc.csv --out results/ema_signals.csv
          cargo run --release -- --ohlc data/ohlc.csv --signals results/ema_signals.csv --out results/ema --on-close
      - name: Cached fast-sync smoke test
        run: |
          python3 tools/fast_sync.py --ohlc data/ohlc.csv --signals data/signals.csv --out results/fast --on-close
          python3 - <<'PY'
          import json
          d=json.load(open("results/fast_sync.json"))
          assert d["status"] == "NO_REFERENCE"
          assert d["engine_summary"]["bars"] == 8
          assert d["tv_full_parity_claim"] is False
          assert d["observed_bars_per_second"] > 0
          print("Fast-sync runner passes; no TV parity asserted.")
          PY
      - name: Validate result files
        run: |
          python3 - <<'PY'
          import json,csv
          a=json.load(open('results/demo_summary.json'))
          assert a['bars']==8
          assert a['closed_trades']==2
          assert a['tv_parity_verified'] is False
          with open('results/demo_trades.csv') as f: assert len(list(csv.DictReader(f))) == 2
          print('MVP smoke checks OK')
          PY
